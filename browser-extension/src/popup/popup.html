<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Central de Dados — Contratos</title>
<style>
  :root {
    --cor-primaria: #4f46e5;
    --cor-primaria-hover: #4338ca;
    --cor-fundo: #f8fafc;
    --cor-card: #ffffff;
    --cor-borda: #e2e8f0;
    --cor-texto: #0f172a;
    --cor-texto-suave: #64748b;
    --cor-sucesso-bg: #ecfdf5;
    --cor-sucesso-texto: #15803d;
    --cor-erro-bg: #fef2f2;
    --cor-erro-texto: #b91c1c;
    --raio: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    width: 380px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--cor-fundo);
    color: var(--cor-texto);
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 18px 12px;
  }

  .header .logo {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: var(--cor-primaria);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .header .logo svg { width: 18px; height: 18px; }

  .header h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    line-height: 1.3;
  }

  .header p {
    font-size: 11.5px;
    color: var(--cor-texto-suave);
    margin: 1px 0 0;
  }

  .conteudo { padding: 0 18px 18px; }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    padding: 7px 10px;
    border-radius: 999px;
    margin-bottom: 14px;
    width: fit-content;
  }

  .status .ponto {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .status.ok { background: var(--cor-sucesso-bg); color: var(--cor-sucesso-texto); }
  .status.ok .ponto { background: #22c55e; }
  .status.erro { background: var(--cor-erro-bg); color: var(--cor-erro-texto); }
  .status.erro .ponto { background: #ef4444; }

  .card {
    background: var(--cor-card);
    border: 1px solid var(--cor-borda);
    border-radius: var(--raio);
    padding: 14px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }

  .campo { margin-bottom: 10px; }
  .campo:last-of-type { margin-bottom: 0; }

  .campo label {
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--cor-texto-suave);
    margin-bottom: 4px;
  }

  .campo input {
    width: 100%;
    padding: 8px 10px;
    font-size: 13px;
    border: 1px solid var(--cor-borda);
    border-radius: 8px;
    background: #fff;
    color: var(--cor-texto);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .campo input:focus {
    border-color: var(--cor-primaria);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s ease, opacity 0.15s ease, transform 0.05s ease;
  }

  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.55; cursor: default; }

  .btn-primario {
    width: 100%;
    padding: 9px;
    margin-top: 12px;
    background: var(--cor-primaria);
    color: #fff;
  }
  .btn-primario:hover:not(:disabled) { background: var(--cor-primaria-hover); }

  .btn-secundario {
    flex: 1;
    padding: 7px 8px;
    background: #f1f5f9;
    color: var(--cor-texto);
    font-size: 12px;
  }
  .btn-secundario:hover:not(:disabled) { background: #e2e8f0; }

  .btn svg { width: 14px; height: 14px; }

  .spinner {
    width: 13px; height: 13px;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: girar 0.6s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  .resultado {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
  }

  .vazio {
    font-size: 12.5px;
    color: var(--cor-texto-suave);
    text-align: center;
    padding: 14px 0;
  }

  .candidato {
    border: 1px solid var(--cor-borda);
    border-radius: var(--raio);
    padding: 10px 12px;
    background: #fff;
  }

  .candidato .titulo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
  }

  .candidato .numero {
    font-size: 13.5px;
    font-weight: 700;
  }

  .badge {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    background: #eef2ff;
    color: var(--cor-primaria);
    white-space: nowrap;
  }

  .candidato .subtitulo {
    font-size: 12px;
    color: var(--cor-texto-suave);
    margin-bottom: 8px;
  }

  .candidato .acoes {
    display: flex;
    gap: 6px;
  }

  .msg {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    margin-top: 10px;
    padding: 8px 10px;
    border-radius: 8px;
  }
  .msg:empty { display: none; }
  .msg.erro { background: var(--cor-erro-bg); color: var(--cor-erro-texto); }
  .msg.ok { background: var(--cor-sucesso-bg); color: var(--cor-sucesso-texto); }
  .msg.info { background: #f1f5f9; color: var(--cor-texto-suave); }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5V4.5A2 2 0 0 1 6 2.5h8l4 4v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/>
        <path d="M14 2.5V7h4"/>
        <path d="M8 13h8M8 17h5"/>
      </svg>
    </div>
    <div>
      <h1>Central de Dados</h1>
      <p>Betha Contratos</p>
    </div>
  </div>

  <div class="conteudo">
    <div id="status" class="status"><span class="ponto"></span><span id="statusTexto">Verificando sessão…</span></div>

    <div class="card">
      <div class="campo">
        <label for="sequencial">Sequencial (exato, opcional)</label>
        <input id="sequencial" type="text" placeholder="ex.: 104533" />
      </div>
      <div class="campo">
        <label for="numero">Número/Ano do contrato</label>
        <input id="numero" type="text" placeholder="ex.: 117/2026" />
      </div>
      <button id="buscar" class="btn btn-primario">
        <span id="buscarIcone">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>
          </svg>
        </span>
        <span id="buscarTexto">Buscar</span>
      </button>
    </div>

    <div id="resultado" class="resultado"></div>
    <div id="msg" class="msg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
