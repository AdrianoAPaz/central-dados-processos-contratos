<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Relatório de processo administrativo</title>
<style>
  /* Tipografia sóbria de documento administrativo/de auditoria: fonte serifada,
     hierarquia h1 > h2 > h3 > h4, cores neutras e sem elementos decorativos. */
  body { font-family: 'Times New Roman', Times, 'Liberation Serif', serif; font-size: 14px; line-height: 1.45; max-width: 760px; margin: 24px auto; color: #1a1a1a; }
  h1 { font-size: 22px; font-weight: bold; margin: 0 0 2px; }
  .subtitulo { color: #555; font-size: 13px; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1.5px solid #555; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 6px 10px; border-bottom: 1px solid #d0d0d0; font-size: 14px; vertical-align: top; }
  td.campo { width: 40%; font-weight: bold; color: #1a1a1a; background: #f5f5f5; }
  td.valor { white-space: pre-line; }
  .acoes { margin-top: 20px; }
  button { padding: 6px 16px; font-family: inherit; font-size: 14px; cursor: pointer; }
  .vazio { color: #8a1c1c; font-size: 14px; }

  h2 { font-size: 17px; font-weight: bold; margin: 26px 0 8px; padding-bottom: 3px; border-bottom: 1px solid #b0b0b0; }

  .aditivos { margin-top: 28px; }
  .aditivo-secao { margin-bottom: 18px; page-break-inside: avoid; }
  .aditivo-secao h3 {
    font-size: 15px;
    font-weight: bold;
    margin: 14px 0 4px;
  }
  .aditivo-secao h4 {
    font-size: 14px;
    font-weight: bold;
    font-style: italic;
    color: #333;
    margin: 12px 0 4px 10px;
  }
  .aditivo-secao h4 + table {
    margin-left: 10px;
    width: calc(100% - 10px);
  }

  .tabela-itens { margin: 6px 0 4px; }
  .tabela-itens th, .tabela-itens td {
    padding: 4px 8px;
    border: 1px solid #c8c8c8;
    font-size: 13px;
    text-align: left;
  }
  .tabela-itens th { background: #e8e8e8; font-weight: bold; }
  .sem-itens { color: #555; font-size: 13px; font-style: italic; margin: 4px 0 0; }

  .lista-anexos { list-style: none; padding: 0; margin: 0; }
  .lista-anexos li { padding: 4px 0; font-size: 13px; border-bottom: 1px solid #e8e8e8; }

  @media print {
    .lista-anexos { display: none; }
    .acoes { display: none; }
    body { margin: 0; }
  }
</style>
</head>
<body>
  <h1>Relatório de processo administrativo</h1>
  <div class="subtitulo">Central de Dados de Processos e Contratos</div>

  <table id="tabela"></table>
  <p id="vazio" class="vazio" hidden>Nenhum processo selecionado. Feche esta aba e gere o relatório novamente pelo popup da extensão.</p>

  <div id="tabelas"></div>

  <div id="documentos" class="aditivos"></div>

  <div id="anexos"></div>

  <div class="acoes">
    <button id="imprimir">Salvar como PDF</button>
  </div>

  <!-- Vendorizadas (sem CDN — CSP só permite 'self'; ver src/vendor/README.md).
       Ordem importa: autotable se auto-registra em window.jspdf.jsPDF ao
       carregar, então jsPDF tem que vir primeiro. -->
  <script src="../vendor/jspdf.umd.min.js"></script>
  <script src="../vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="processo.js" type="module"></script>
</body>
</html>
