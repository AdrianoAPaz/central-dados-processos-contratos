<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Relatório de contrato</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; max-width: 720px; margin: 24px auto; color: #222; }
  h1 { font-size: 18px; margin-bottom: 2px; }
  .subtitulo { color: #666; font-size: 12px; margin-bottom: 18px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 10px; border-bottom: 1px solid #e0e0e0; font-size: 13px; vertical-align: top; }
  td.campo { width: 40%; font-weight: bold; color: #444; }
  .acoes { margin-top: 20px; }
  button { padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .vazio { color: #b3261e; font-size: 13px; }

  .aditivos { margin-top: 28px; }
  .aditivos h2 { font-size: 15px; margin-bottom: 10px; }
  .aditivo-secao { margin-bottom: 18px; page-break-inside: avoid; }
  .aditivo-secao h3 {
    font-size: 13px;
    background: #f2f2f2;
    padding: 6px 10px;
    margin: 0 0 4px;
    border-radius: 4px;
  }

  @media print {
    .acoes { display: none; }
    body { margin: 0; }
  }
</style>
</head>
<body>
  <h1>Relatório de contrato</h1>
  <div class="subtitulo">Central de Dados de Processos e Contratos</div>

  <table id="tabela"></table>
  <p id="vazio" class="vazio" hidden>Nenhum contrato selecionado. Feche esta aba e gere o relatório novamente pelo popup da extensão.</p>

  <div id="aditivos" class="aditivos"></div>

  <div class="acoes">
    <button id="imprimir">Salvar como PDF</button>
  </div>

  <script src="report.js" type="module"></script>
</body>
</html>
